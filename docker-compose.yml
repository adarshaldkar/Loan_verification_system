version: "3.8"

services:
  # ── 1. Nginx Reverse Proxy (Ingress Gateway) ──
  reverse-proxy:
    image: nginx:alpine
    container_name: lvms-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lvms-network

  # ── 2. Next.js Frontend Application ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lvms-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - lvms-network

  # ── 3. Express.js + Prisma Backend API ──
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lvms-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres:5432/loan_verification_db?schema=public
      - JWT_SECRET=lvms_super_secret_jwt_key_2026_freelance_prod
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lvms-network

  # ── 4. PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: lvms-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=loan_verification_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_verification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lvms-network

  # ── 5. Redis Cache & Job Queue ──
  redis:
    image: redis:7-alpine
    container_name: lvms-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - lvms-network

networks:
  lvms-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
