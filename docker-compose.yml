version: "3.8"

services:
  # ── 1. Nginx Reverse Proxy (Ingress Gateway) ──
  reverse-proxy:
    image: nginx:alpine
    container_name: lvms-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lvms-network

  # ── 2. Next.js Frontend Application ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lvms-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - INTERNAL_BACKEND_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=/api/v1
    depends_on:
      - backend
    networks:
      - lvms-network

  # ── 3. Express.js + Prisma Backend API ──
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: lvms-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres:5432/loan_verification_db?schema=public
      - JWT_SECRET=lvms_super_secret_jwt_key_2026_freelance_prod
      - REDIS_URL=redis://redis:6379
      - OTEL_SERVICE_NAME=lvms-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - ENABLE_TRACING=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lvms-network

  # ── 4. PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: lvms-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass
      - POSTGRES_DB=loan_verification_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d loan_verification_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lvms-network

  # ── 5. Redis Cache & Job Queue ──
  redis:
    image: redis:7-alpine
    container_name: lvms-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - lvms-network

  # ── 6. Grafana Alloy (Central Telemetry Pipeline to Grafana Cloud) ──
  alloy:
    image: grafana/alloy:v1.3.1
    container_name: lvms-alloy
    restart: always
    environment:
      - GRAFANA_CLOUD_OTLP_ENDPOINT=${GRAFANA_CLOUD_OTLP_ENDPOINT:-}
      - GRAFANA_CLOUD_OTLP_AUTH_HEADER=${GRAFANA_CLOUD_OTLP_AUTH_HEADER:-}
      - GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL=${GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL:-}
      - GRAFANA_CLOUD_PROMETHEUS_USERNAME=${GRAFANA_CLOUD_PROMETHEUS_USERNAME:-}
      - GRAFANA_CLOUD_PROMETHEUS_API_KEY=${GRAFANA_CLOUD_PROMETHEUS_API_KEY:-}
      - GRAFANA_CLOUD_LOKI_URL=${GRAFANA_CLOUD_LOKI_URL:-}
      - GRAFANA_CLOUD_LOKI_USERNAME=${GRAFANA_CLOUD_LOKI_USERNAME:-}
      - GRAFANA_CLOUD_LOKI_API_KEY=${GRAFANA_CLOUD_LOKI_API_KEY:-}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - backend
    networks:
      - lvms-network

  # ── 7. Node Exporter (Host VPS Metrics) ──
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lvms-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - lvms-network

  # ── 8. cAdvisor (Per-Container Resource Metrics) ──
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lvms-cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - lvms-network

  # ── 9. PostgreSQL Exporter ──
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: lvms-postgres-exporter
    restart: always
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres_secure_pass@postgres:5432/loan_verification_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lvms-network

  # ── 10. Redis Exporter ──
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: lvms-redis-exporter
    restart: always
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    networks:
      - lvms-network

  # ── 11. Prometheus (Local TSDB & Alerting Engine) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: lvms-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheusdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - backend
    networks:
      - lvms-network

  # ── 12. Grafana (Observability & Health Dashboards) ──
  grafana:
    image: grafana/grafana:latest
    container_name: lvms-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_secure_pass
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - lvms-network

networks:
  lvms-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
