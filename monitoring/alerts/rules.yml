groups:
  - name: lvms_availability_and_health
    rules:
      - alert: ApiUnavailable
        expr: up{job="lvms-backend"} == 0
        for: 2m
        labels:
          severity: critical
          service: lvms-api
        annotations:
          summary: "LVMS Backend API is unavailable"
          description: "LVMS Express API instance has been down for more than 2 minutes."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#api-unavailable"

      - alert: HighApiErrorRate
        expr: (sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001)) > 0.05
        for: 5m
        labels:
          severity: critical
          service: lvms-api
        annotations:
          summary: "High 5xx HTTP Error Rate (> 5%)"
          description: "LVMS API error rate has exceeded 5% for the last 5 minutes (current: {{ $value | humanizePercentage }})."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#high-api-error-rate"

      - alert: HighApiLatencyWarning
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.0
        for: 5m
        labels:
          severity: warning
          service: lvms-api
        annotations:
          summary: "High API P95 Latency (> 1s)"
          description: "LVMS API P95 latency is exceeding 1.0 second (current: {{ $value | humanizeDuration }})."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#high-latency"

      - alert: SevereApiLatencyCritical
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2.0
        for: 5m
        labels:
          severity: critical
          service: lvms-api
        annotations:
          summary: "Severe API P95 Latency (> 2s)"
          description: "LVMS API P95 latency is critically high (> 2.0s) for 5 minutes (current: {{ $value | humanizeDuration }})."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#severe-latency"

  - name: lvms_infrastructure_saturation
    rules:
      - alert: HostCpuSaturation
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
          service: vps-host
        annotations:
          summary: "Host CPU Saturation (> 85%)"
          description: "Host CPU utilization has exceeded 85% for more than 10 minutes."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#cpu-saturation"

      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.15
        for: 10m
        labels:
          severity: warning
          service: vps-host
        annotations:
          summary: "Host Memory Pressure (< 15% available)"
          description: "Host RAM is over 85% full for more than 10 minutes."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#memory-pressure"

      - alert: HostDiskFillingWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.20
        for: 10m
        labels:
          severity: warning
          service: vps-host
        annotations:
          summary: "Host Root Disk Space Low (< 20% free)"
          description: "VPS root partition disk space usage has exceeded 80%."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#disk-filling"

      - alert: HostDiskFillingCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
        for: 5m
        labels:
          severity: critical
          service: vps-host
        annotations:
          summary: "Host Root Disk Space Critical (< 10% free)"
          description: "VPS root partition disk space is nearly exhausted (> 90% full)."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#disk-filling"

  - name: lvms_data_and_workflows
    rules:
      - alert: RedisDependencyErrors
        expr: sum(rate(lvms_redis_operations_total{status="error"}[5m])) > 5
        for: 3m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis Cache / Geofence Failures"
          description: "Repeated Redis operation failures detected in LVMS backend."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#dependency-outage"

      - alert: ExcelImportFailureSpike
        expr: sum(rate(lvms_excel_import_records_total{status="failed"}[10m])) > 20
        for: 5m
        labels:
          severity: warning
          service: lvms-api
        annotations:
          summary: "Excel Bulk Import Failures Detected"
          description: "More than 20 verification rows failed during Excel import in the last 10 minutes."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#import-failures"

      - alert: ReportGenerationFailureSpike
        expr: sum(rate(lvms_report_generation_duration_seconds_count[10m])) > 0 and sum(rate(lvms_external_dependency_errors_total{dependency="report_generator"}[10m])) > 2
        for: 5m
        labels:
          severity: warning
          service: lvms-api
        annotations:
          summary: "RCU Report Generation Failures"
          description: "PDF/DOCX report compilation operations are failing repeatedly."
          runbook_url: "https://github.com/adarshaldkar/Loan_verification_system/blob/main/observability/runbooks/alert_runbooks.md#report-generation"
